# Docker's embedded DNS (127.0.0.11) resolves service names to container
# IPs. Without an explicit resolver + a variable in proxy_pass, nginx
# resolves each upstream hostname once and caches that IP for the life of
# the worker process — if a backend container is later recreated (a normal
# `docker compose up -d --no-deps <service>` during development), nginx
# keeps proxying to the old, now-dead IP and every request 502s until the
# gateway itself is restarted. Using a variable forces re-resolution on
# this TTL instead, so gateway survives individual services restarting.
resolver 127.0.0.11 valid=10s;

server {
  listen 80;

  # No trailing slash on any of these: the frontend calls exact paths with
  # no trailing slash too (e.g. GET /api/users, GET /api/roles,
  # GET /api/audit-logs?...). A trailing-slash location prefix (e.g.
  # "/api/users/") would NOT match those exact paths, only sub-paths.
  location /api/auth {
    set $upstream http://auth-service:4001;
    proxy_pass $upstream;
    proxy_set_header Host $host;
  }
  location /api/users {
    set $upstream http://auth-service:4001;
    proxy_pass $upstream;
    proxy_set_header Host $host;
  }
  location /api/roles {
    set $upstream http://auth-service:4001;
    proxy_pass $upstream;
    proxy_set_header Host $host;
  }
  location /api/inventory {
    set $upstream http://inventory-service:4002;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    client_max_body_size 1m;
  }
  location /api/audit-logs {
    set $upstream http://audit-service:4003;
    proxy_pass $upstream;
    proxy_set_header Host $host;
  }
}
